# GIAS：Mosquitto 2.x 安全設定範例（S-02，說明見 docs/mqtt_security.md）
# 路徑請依安裝位置調整；Windows 路徑可用正斜線。

per_listener_settings false

# 不接受匿名連線；帳號在密碼檔（mosquitto_passwd 產生），可用的 topic 由 ACL 決定
allow_anonymous false
password_file C:/Program Files/mosquitto/gias_passwd
acl_file C:/Program Files/mosquitto/gias_acl.conf

# TLS listener：GIAS 元件連這個埠
listener 8883
cafile   C:/Program Files/mosquitto/certs/ca.crt
certfile C:/Program Files/mosquitto/certs/server.crt
keyfile  C:/Program Files/mosquitto/certs/server.key
tls_version tlsv1.2
# 要求用戶端出示憑證（gias.toml 的 tls.certfile / tls.keyfile）時開啟：
# require_certificate true

# 選用：只給本機除錯用的明文 listener，綁在 127.0.0.1，外部連不到
# listener 1884 127.0.0.1
