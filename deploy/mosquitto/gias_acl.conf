# GIAS：Mosquitto ACL 範例（S-02，說明見 docs/mqtt_security.md）
# 設定 acl_file 後，沒有列出的帳號與 topic 一律拒絕。
# GIAS 的 topic 是單層名稱（例：info.request、blackboard.control），MQTT 萬用字元無法依前綴篩選，
# 因此 GIAS 服務帳號開放全部 topic；其他帳號只能列出確切的 topic 名稱。

# GIAS 服務帳號：所有 GIAS 元件共用（gias.toml 的 [broker.<name>] username）
user gias
topic readwrite #

# 選用：唯讀監看帳號（例如儀表板），只能收意圖狀態
# user gias_monitor
# topic read intention.status
